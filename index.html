import * as THREE from 'three';

  g.position.set(x,0,z);scene.add(g);}

const B={x0:-44,x1:-4,z0:-9,z1:5,floors:4,fh:3.4};

box(4,bh+2,bd-2,'#f6f5f2',B.x0-1.6,(bh+2)/2,(B.z0+B.z1)/2-.5,WH);

   box(bl+.4,.45,1.6,'#fcfcfa',bx,y+B.fh-.2,B.z1+.8,WH);                 // balcony slab

{const s=textPlane('Electrical & Electronic Engineering',13,.9,{color:'#25327a',font:'bold 70px Arial'});s.position.set(B.x0+8.3,ty+3.0,B.z1+1.42);scene.add(s);}

{const ax=B.x0+1,ay=bh+2;cyl(.07,6,'#777',ax,ay+3,-2,5);[1.2,2.4,3.6].forEach((h,i)=>box(2.2-i*.4,.06,.06,'#777',ax,ay+h+1,-2));}

// ---------- biosolar roof (the whole roof) ----------
const roof={x0:-43.6,x1:-4.4},rw=roof.x1-roof.x0,rcx=(roof.x0+roof.x1)/2,rdz=bd-.8;
const bio=new THREE.Group();scene.add(bio);
function moduleArray(parent,x,y,z,cols=4,rows=2,tilt=.2,mw=1.6,md=1.05){
  const g=new THREE.Group();
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const p=new THREE.Mesh(new THREE.BoxGeometry(mw-.06,.1,md-.06),M('#1f4a88',{roughness:.3,metalness:.35}));p.position.set(-cols*mw/2+mw/2+c*mw,0,-rows*md/2+md/2+r*md);p.castShadow=true;g.add(p);
    const l=new THREE.Mesh(new THREE.BoxGeometry(.03,.11,md-.1),M('#7d9ccc'));l.position.copy(p.position);g.add(l);}
  const fr=new THREE.Mesh(new THREE.BoxGeometry(cols*mw+.1,.06,rows*md+.1),M('#c3cad1'));fr.position.y=-.07;g.add(fr);
  g.rotation.x=-tilt;g.position.set(x,y,z);parent.add(g);return g;}
function legs(parent,x,y0,y1,z,w=6.2,d=2){[[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2],[0,-d/2],[0,d/2]].forEach(([dx,dz])=>{const h=y1-y0+(dz<0?.35:0);const m=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,h,5),M('#7f878e'));m.position.set(x+dx,y0+h/2,z+dz);parent.add(m);});}

const evapArrows=[];
function wavy(parent,x,y,z){const pts=[];for(let i=0;i<=20;i++){const t=i/20;pts.push(new THREE.Vector3(Math.sin(t*Math.PI*3)*.25,t*1.6,0));}

  const hd=new THREE.Mesh(new THREE.ConeGeometry(.2,.45,6),mat);hd.position.y=1.75;g.add(hd);g.position.set(x,y,z);parent.add(g);evapArrows.push({g,mat,x0:x,y0:y,ph:Math.random()});return g;}
// build-up: slab, root barrier + waterproofing, drainage, growing medium

});
{const b=textPlane('BIOSOLAR ROOF (proposal)',9,.7,{bg:'#2e8b57',color:'#fff',font:'bold 120px Arial',align:'center'});b.position.set(rcx,RY+.75,B.z1+.02);scene.add(b);}

{const g=textPlane('Campus Rider',1.5,.5,{bg:'#1d6e3a',color:'#fff',font:'bold 150px Arial',align:'center'});g.position.set(sx-9,4,sz+1.86);scene.add(g);
 const y=textPlane('Campus Loop',1.5,.55,{bg:'#f2c230',color:'#1a1a1a',font:'bold 150px Arial',align:'center'});y.position.set(sx-9,3.35,sz+1.86);scene.add(y);}

 1:['#2e8b57','Stage 1 · Short-term pilot','① Biosolar roof','Same panels, same roof — now raised above low-growing plants.<ul><li>Cooler panels → more output</li><li>Cooler building below</li><li>New green space for biodiversity</li></ul>'],
 2:['#2e8b57','Stage 2 · Long term','② Solar Cool Stop','When rooftop panels retire, the ones that pass safety and performance checks get a second life as the Campus Loop shelter\'s roof, powering:<ul><li>Ceiling fans</li><li>LED lighting</li><li>Phone charging</li></ul>A small battery covers evenings and cloudy spells.']};

// ----- state -----
let cur=0,camTween=null;
const HOLD=8,TWEEN=1.2;
const tour={playing:false,paused:false,hold:0};

// ----- controls -----
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.minDistance=6;controls.maxDistance=150;
controls.minPolarAngle=.05;controls.maxPolarAngle=Math.PI/2-.04;   // never below the ground plane
controls.zoomSpeed=.8;controls.rotateSpeed=.7;
const LIM={x:[-70,80],y:[.5,40],z:[-45,55]};
function clampTarget(){const t=controls.target,d=new THREE.Vector3(clamp(t.x,...LIM.x)-t.x,clamp(t.y,...LIM.y)-t.y,clamp(t.z,...LIM.z)-t.z);
  if(d.lengthSq()>0){t.add(d);camera.position.add(d);}}
function flyTo(p,t,dur=TWEEN){camTween={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t),t:0,dur};controls.enabled=false;}
function cancelFly(){camTween=null;controls.enabled=true;}

// ----- UI state helpers -----
function setStep(n){cur=n;
  document.querySelectorAll('#tour .step').forEach(d=>{d.classList.toggle('act',+d.dataset.n===n);d.querySelector('em').style.width='0';});
  pins.forEach((p,i)=>p.classList.toggle('act',i+1===n));
  const c=$('card');
  if(n&&CARDS[n]){const [col,tag,h,body]=CARDS[n];c.style.display='none';c.style.borderTopColor=col;c.innerHTML=`<span class="tag" style="color:${col}">${tag}</span><h3>${h}</h3><div class="body">${body}</div>`;void c.offsetWidth;c.style.display='block';}else c.style.display='none';
  refreshButtons();}
function refreshButtons(){$('start').style.display=(cur===0&&!tour.playing)?'block':'none';
  const b=$('play');b.classList.toggle('on',tour.playing);b.innerHTML=tour.playing&&!tour.paused?ICON.pause:ICON.play;
  b.title=tour.playing?(tour.paused?'Resume the guided tour (space)':'Pause the guided tour (space)'):'Play the guided tour (space)';}
function goTo(n){setStep(n);const v=viewFor(n);flyTo(v.p,v.t);}

// ----- guided tour -----
function startTour(){tour.playing=true;tour.paused=false;tour.hold=0;goTo(cur>=1&&cur<NSTOPS?cur:1);refreshButtons();}
function stopTour(){if(!tour.playing)return;tour.playing=false;tour.paused=false;document.querySelectorAll('#tour .step em').forEach(e=>e.style.width='0');refreshButtons();}
function endTour(){stopTour();goTo(0);}
function tickTour(dt){if(!tour.playing||tour.paused||camTween)return;tour.hold+=dt;
  const act=document.querySelector('#tour .step.act em');if(act)act.style.width=(clamp(tour.hold/HOLD,0,1)*100)+'%';
  if(tour.hold>=HOLD){tour.hold=0;if(cur>=NSTOPS)endTour();else goTo(cur+1);}}
const userNav=fn=>{stopTour();fn();};
const nextStop=()=>(cur+1)%(NSTOPS+1),prevStop=()=>(cur+NSTOPS)%(NSTOPS+1);

// ----- events -----
pins.forEach((p,i)=>p.addEventListener('click',()=>userNav(()=>goTo(i+1))));
document.querySelectorAll('#tour .step').forEach(d=>d.addEventListener('click',()=>userNav(()=>goTo(+d.dataset.n))));
$('prev').addEventListener('click',()=>userNav(()=>goTo(prevStop())));
$('next').addEventListener('click',()=>userNav(()=>goTo(nextStop())));
$('play').addEventListener('click',()=>{if(tour.playing){tour.paused=!tour.paused;refreshButtons();}else startTour();});
$('start').addEventListener('click',startTour);
$('reset').addEventListener('click',()=>userNav(()=>goTo(0)));
// any drag / swipe on the scene cancels an in-flight camera move and stops the auto tour
renderer.domElement.addEventListener('pointerdown',()=>{cancelFly();stopTour();},{capture:true,passive:true});
// trackpad: a two-finger swipe orbits, a pinch (ctrl+wheel) zooms; a mouse wheel keeps zooming
const wheelRot={theta:0,phi:0};
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();cancelFly();stopTour();
  const mouseLike=e.deltaMode!==0||(e.deltaX===0&&Math.abs(e.deltaY)>=50&&Math.abs(e.wheelDeltaY||0)%120===0);
  if(e.ctrlKey||mouseLike)return;                                   // OrbitControls handles the zoom
  e.stopImmediatePropagation();
  wheelRot.theta-=e.deltaX*.004;wheelRot.phi-=e.deltaY*.004;},{capture:true,passive:false});
const _off=new THREE.Vector3(),_sph=new THREE.Spherical();
function applyWheelOrbit(dt){if(Math.abs(wheelRot.theta)<1e-4&&Math.abs(wheelRot.phi)<1e-4)return;
  const k=Math.min(1,dt*10),dth=wheelRot.theta*k,dph=wheelRot.phi*k;wheelRot.theta-=dth;wheelRot.phi-=dph;
  _off.copy(camera.position).sub(controls.target);_sph.setFromVector3(_off);_sph.theta+=dth;_sph.phi=clamp(_sph.phi+dph,controls.minPolarAngle,controls.maxPolarAngle);
  camera.position.copy(controls.target).add(_off.setFromSpherical(_sph));}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){userNav(()=>goTo(nextStop()));}else if(e.key==='ArrowLeft'){userNav(()=>goTo(prevStop()));}
  else if(e.key===' '){e.preventDefault();$('play').click();}else if(e.key==='Escape'||e.key==='Home'){userNav(()=>goTo(0));}
  else if(/^[0-9]$/.test(e.key)&&+e.key<=NSTOPS){userNav(()=>goTo(+e.key));}});
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);});

// ----- window API kept for shoot2.mjs (stills / tour frames) -----
window.setStep=setStep;
window.setMode=()=>{};   // kept for older scripts: there is only one bus-stop state now
window.setUI=(v)=>{document.querySelectorAll('.ui').forEach(e=>e.style.visibility=v?'visible':'hidden');pins.forEach(p=>p.style.visibility=v?'':'hidden');window._ui=v;};
window._ui=true;
window.setCam=(p,t)=>{cancelFly();camera.position.set(...p);controls.target.set(...t);controls.update();camera.updateMatrixWorld();};
window.showPins=(v)=>pins.forEach(p=>p.style.display=v?'flex':'none');
window.hideCard=()=>{$('card').style.display='none'};
window.goTo=goTo;window.startTour=startTour;window.stopTour=stopTour;window.setBusT=(t)=>{cycT=t;busT=t%BUS_T;busPrevX=null;agents.forEach(a=>a.st.px=null);};
window.state=()=>({cur,cam:camera.position.toArray().map(v=>+v.toFixed(2)),playing:tour.playing,paused:tour.paused,flying:!!camTween,bus:{t:+busT.toFixed(2),x:+bus.position.x.toFixed(1),visible:bus.visible,opacity:+busMats[0].m.opacity.toFixed(2)},busCycle:+BUS_T.toFixed(2),busArrives:+t2.toFixed(2),busDeparts:+t3.toFixed(2),people:agents.filter(a=>a.st.g.visible).length});

// ----- render loop -----
const _v=new THREE.Vector3();let T=0;
function tick(dt){T+=dt;
  fans.forEach(f=>f.rotation.y+=dt*7);
  evapArrows.forEach(a=>{const f=(T*.22+a.ph)%1;a.g.position.y=a.y0+f*1.1;a.g.position.x=a.x0+Math.sin(T*1.6+a.ph*6.28)*.08;a.mat.opacity=.15+.85*Math.sin(f*Math.PI);});
  tickBus(dt);tickPeople(dt);tickPower();
  if(camTween){const c=camTween;c.t+=dt;const k=easeInOutCubic(Math.min(1,c.t/c.dur));camera.position.lerpVectors(c.p0,c.p1,k);controls.target.lerpVectors(c.t0,c.t1,k);if(k>=1)cancelFly();}
  applyWheelOrbit(dt);controls.update();clampTarget();
  tickTour(dt);}
function placePins(){HS.forEach((h,i)=>{const v=_v.set(...h).project(camera);const d=pins[i];
  if(!window._ui||v.z>1||Math.abs(v.x)>1.05||Math.abs(v.y)>1.05){d.style.visibility='hidden';return;}d.style.visibility='visible';
  d.style.left=((v.x+1)/2*W)+'px';d.style.top=((1-v.y)/2*H)+'px';});}
window.draw=(dt=.15)=>{tick(dt);renderer.render(scene,camera);placePins();};
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.5);tick(dt);renderer.render(scene,camera);placePins();}

// ----- start -----
{const v=viewFor(0);camera.position.set(...v.p);controls.target.set(...v.t);controls.update();}
setStep(0);
frame();
window.ready=true;
</script></body></html>
