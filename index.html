const BUS_T=10;let busT=0,busPrevX=null;
function busX(t){ // position along the road for a 10 s cycle: cruise in → brake → wait at the shelter → pull away → cruise out → off stage
  const v=26.7;
  if(t<2.4)return -64+v*t;
  if(t<4.5){const u=(t-2.4)/2.1;return 28*(1-(1-u)*(1-u));}
  if(t<6.0)return 28;
  if(t<7.8){const u=(t-6)/1.8;return 28+24*u*u;}
  if(t<8.55)return 52+v*(t-7.8);
  return null;}
function tickBus(dt){busT=(busT+dt)%BUS_T;const x=busX(busT);
  if(x===null){bus.visible=false;busPrevX=null;return;}
  bus.visible=true;bus.position.x=x;
  const op=clamp(Math.min((x+54)/10,(66-x)/10),0,1);
  busMats.forEach(({m,t0})=>{m.opacity=op;m.transparent=t0||op<1;});
  if(busPrevX!==null)wheels.forEach(p=>p.rotation.z-=(x-busPrevX)/.52);busPrevX=x;}

// ---------- hotspots / UI ----------
const $=id=>document.getElementById(id);
const ICON={play:'<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',

const CARDS={
 1:['#c8553d','Today','① Hot roof (as it is now)','Solar panels sit low over a bare concrete roof. In Singapore\'s heat the roof and panels get very hot — hotter panels produce less electricity, and heat soaks into the building below.'],

 3:['#2e8b57','Stage 1 · How it works','③ What\'s underneath','<ul><li><b>Plants</b> — low-growing, won\'t shade panels</li><li><b>Growing medium</b> — lightweight soil</li><li><b>Drainage layer</b></li><li><b>Root barrier + waterproofing</b></li><li><b>Existing roof slab</b> — load to be checked</li></ul>'],
 4:['#2e8b57','Stage 2 · Long term','④ Campus Loop stop → Solar Cool Stop','When rooftop panels retire, the ones that pass safety and performance checks get a second life as the shelter\'s roof, powering:<ul><li>Ceiling fans</li><li>LED lighting</li><li>Phone charging</li></ul>A small battery covers evenings and cloudy spells.<div class="hint">Use the <b>Today / Solar Cool Stop</b> switch (top right) to compare.</div>']};

// ----- state -----
let cur=0,mode='proposal',camTween=null,modeAnim=null,pendingFlip=-1;
const HOLD=8,TWEEN=1.2,FLIP_AFTER=2.2;
const tour={playing:false,paused:false,hold:0};

// ----- controls -----
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.minDistance=6;controls.maxDistance=150;
controls.minPolarAngle=.05;controls.maxPolarAngle=Math.PI/2-.04;   // never below the ground plane
controls.zoomSpeed=.8;controls.rotateSpeed=.7;
const LIM={x:[-70,80],y:[.5,40],z:[-45,55]};
function clampTarget(){const t=controls.target,d=new THREE.Vector3(clamp(t.x,...LIM.x)-t.x,clamp(t.y,...LIM.y)-t.y,clamp(t.z,...LIM.z)-t.z);
  if(d.lengthSq()>0){t.add(d);camera.position.add(d);}}
function flyTo(p,t,dur=TWEEN){camTween={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t),t:0,dur};controls.enabled=false;}
function cancelFly(){camTween=null;controls.enabled=true;}

// ----- UI state helpers -----
function setStep(n){cur=n;
  document.querySelectorAll('#tour .step').forEach(d=>{d.classList.toggle('act',+d.dataset.n===n);d.querySelector('em').style.width='0';});
  pins.forEach((p,i)=>p.classList.toggle('act',i+1===n));
  const c=$('card');
  if(n&&CARDS[n]){const [col,tag,h,body]=CARDS[n];c.style.display='none';c.style.borderTopColor=col;c.innerHTML=`<span class="tag" style="color:${col}">${tag}</span><h3>${h}</h3><div class="body">${body}</div>`;void c.offsetWidth;c.style.display='block';}else c.style.display='none';
  refreshButtons();}
function refreshButtons(){$('start').style.display=(cur===0&&!tour.playing)?'block':'none';
  const b=$('play');b.classList.toggle('on',tour.playing);b.innerHTML=tour.playing&&!tour.paused?ICON.pause:ICON.play;
  b.title=tour.playing?(tour.paused?'Resume the guided tour (space)':'Pause the guided tour (space)'):'Play the guided tour (space)';}
function setMode(m,animate=false){const prev=mode;mode=m;pendingFlip=-1;
  $('tToday').className=m==='today'?'today':'';$('tProp').className=m!=='today'?'proposal':'';
  conv[0].visible=true;bio[0].visible=false;conv[1].visible=false;bio[1].visible=true;cut.visible=true;   // roof is always split
  const show=m==='today'?todayP:propP,hide=m==='today'?propP:todayP;
  [todayP,propP].forEach(g=>g.scale.setScalar(1));
  if(!animate||prev===m){modeAnim=null;show.visible=true;hide.visible=false;return;}
  hide.visible=true;show.visible=false;show.scale.setScalar(.001);modeAnim={hide,show,t:0};}
function goTo(n){const prev=cur;setStep(n);const v=viewFor(n);flyTo(v.p,v.t);
  if(n===4&&prev!==4){setMode('today',false);pendingFlip=TWEEN+FLIP_AFTER;}   // stop 4: show Today first, then flip to the Solar Cool Stop
  else pendingFlip=-1;}

// ----- guided tour -----
function startTour(){tour.playing=true;tour.paused=false;tour.hold=0;goTo(cur>=1&&cur<4?cur:1);refreshButtons();}
function stopTour(){if(!tour.playing)return;tour.playing=false;tour.paused=false;document.querySelectorAll('#tour .step em').forEach(e=>e.style.width='0');refreshButtons();}
function endTour(){stopTour();goTo(0);}
function tickTour(dt){if(!tour.playing||tour.paused||camTween)return;tour.hold+=dt;
  const act=document.querySelector('#tour .step.act em');if(act)act.style.width=(clamp(tour.hold/HOLD,0,1)*100)+'%';
  if(tour.hold>=HOLD){tour.hold=0;if(cur>=4)endTour();else goTo(cur+1);}}
const userNav=fn=>{stopTour();fn();};

// ----- events -----

// any drag / wheel on the scene cancels an in-flight camera move and stops the auto tour
['pointerdown','wheel'].forEach(ev=>renderer.domElement.addEventListener(ev,()=>{cancelFly();stopTour();},{capture:true,passive:true}));
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){userNav(()=>goTo((cur+1)%5));}else if(e.key==='ArrowLeft'){userNav(()=>goTo((cur+4)%5));}
  else if(e.key===' '){e.preventDefault();$('play').click();}else if(e.key==='Escape'||e.key==='Home'){userNav(()=>goTo(0));}
  else if(e.key>='1'&&e.key<='4'){userNav(()=>goTo(+e.key));}else if(e.key==='t'||e.key==='T'){userNav(()=>setMode(mode==='today'?'proposal':'today',true));}});
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);});

// ----- window API kept for shoot2.mjs (stills / tour frames) -----

window.goTo=goTo;window.startTour=startTour;window.stopTour=stopTour;window.setBusT=(t)=>{busT=t;busPrevX=null;};window.state=()=>({cur,mode,playing:tour.playing,paused:tour.paused,flying:!!camTween,bus:{t:+busT.toFixed(2),x:+bus.position.x.toFixed(1),visible:bus.visible,opacity:+busMats[0].m.opacity.toFixed(2)}});

// ----- render loop -----
const _v=new THREE.Vector3();let T=0;
function tick(dt){T+=dt;
  fans.forEach(f=>f.rotation.y+=dt*7);
  heatArrows.forEach(a=>{const f=(T*.35+a.ph)%1;a.g.position.y=a.y0+f*1.4;a.mat.opacity=.1+.9*Math.sin(f*Math.PI);});
  evapArrows.forEach(a=>{const f=(T*.22+a.ph)%1;a.g.position.y=a.y0+f*1.1;a.g.position.x=a.x0+Math.sin(T*1.6+a.ph*6.28)*.08;a.mat.opacity=.15+.85*Math.sin(f*Math.PI);});
  tickBus(dt);
  if(modeAnim){const a=modeAnim;a.t+=dt;
    if(a.t<.25){const k=1-(a.t/.25)*(a.t/.25);a.hide.scale.setScalar(Math.max(k,.001));}
    else{a.hide.visible=false;a.show.visible=true;const u=Math.min(1,(a.t-.25)/.45);a.show.scale.setScalar(Math.max(easeOutBack(u),.001));if(u>=1){a.show.scale.setScalar(1);modeAnim=null;}}}
  if(camTween){const c=camTween;c.t+=dt;const k=easeInOutCubic(Math.min(1,c.t/c.dur));camera.position.lerpVectors(c.p0,c.p1,k);controls.target.lerpVectors(c.t0,c.t1,k);if(k>=1)cancelFly();}
  controls.update();clampTarget();
  if(pendingFlip>0){pendingFlip-=dt;if(pendingFlip<=0){pendingFlip=-1;if(cur===4&&mode==='today')setMode('proposal',true);}}
  tickTour(dt);}
function placePins(){HS.forEach((h,i)=>{const v=_v.set(...h).project(camera);const d=pins[i];
  if(!window._ui||v.z>1||Math.abs(v.x)>1.05||Math.abs(v.y)>1.05){d.style.visibility='hidden';return;}d.style.visibility='visible';
  d.style.left=((v.x+1)/2*W)+'px';d.style.top=((1-v.y)/2*H)+'px';});}
window.draw=(dt=.15)=>{tick(dt);renderer.render(scene,camera);placePins();};
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.5);tick(dt);renderer.render(scene,camera);placePins();}

// ----- start -----
setMode('proposal');

setStep(0);
frame();
window.ready=true;
